[project]
name = "steam-recommender"
version = "0.1.0"
description = "Steam game recommendations from a library: EASE nudged by SASRec, measured on users the models never saw, with a local page."
requires-python = ">=3.12"
license = "MIT"
# the versions the results were measured with; the upper bounds keep a major release from changing them silently
dependencies = ["duckdb>=2.0,<3", "numpy>=2.5,<3", "scipy>=1.18,<2", "scikit-learn>=1.9,<2", "implicit>=0.7.3,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=9"]
seq = ["torch>=2.6"]  # only eval/sasrec.py, and only its training step

[tool.setuptools]
packages = ["recs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
