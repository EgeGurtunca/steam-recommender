[project]
name = "steam-recommender"
version = "0.1.0"
description = "Steam game recommendations from a library: popularity, tags, ALS and a local LLM reranker, with an honest offline eval."
requires-python = ">=3.12"
dependencies = ["duckdb", "numpy", "scipy", "scikit-learn", "implicit"]

[project.optional-dependencies]
dev = ["pytest"]
seq = ["torch"]  # only eval/sasrec.py, and only its training step

[tool.setuptools]
packages = ["recs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
